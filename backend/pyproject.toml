[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "legal-document-assistant-backend"
version = "1.0.0"
description = "Production-grade RAG pipeline backend for legal document Q&A"
requires-python = ">=3.13"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "legal_assistant*", "mcp_servers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
