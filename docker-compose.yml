version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal_rag_backend
    ports:
      - "8000:8000"
    volumes:
      # Persist the Chroma vector store and source documents across restarts
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - LEGAL_RAG_LLM_PROVIDER=${LEGAL_RAG_LLM_PROVIDER:-google}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LEGAL_RAG_API_KEY=${LEGAL_RAG_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: legal_rag_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
