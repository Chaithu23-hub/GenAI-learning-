name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      workflows: ${{ steps.paths.outputs.workflows }}
      security: ${{ steps.paths.outputs.security }}
      rag: ${{ steps.paths.outputs.rag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check credentials in every change
        run: python scripts/ci/security_checks.py --credentials-only
      - name: Detect changed areas
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          FORCE_ALL: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'merge_group') && 'true' || 'false' }}
        run: python scripts/ci/changed_paths.py

  backend:
    name: backend (3.13)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - name: Backend quality checks
        run: python scripts/ci/quality_checks.py
      - name: Backend tests
        working-directory: .
        run: python scripts/ci/run_tests.py --suite backend

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: python scripts/ci/frontend_checks.py --check install
      - name: Angular build
        run: python scripts/ci/frontend_checks.py --check build
      - name: Audit production dependencies
        run: python scripts/ci/frontend_checks.py --check audit
      - name: Angular tests
        run: python scripts/ci/frontend_checks.py --check test

  workflow-lint:
    name: workflow-lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install workflow policy tools
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
      - name: Install actionlint
        run: python scripts/ci/install_actionlint.py --destination "$RUNNER_TEMP/actionlint"
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml'
      - name: Check workflow policies
        run: python scripts/ci/check_workflows.py

  security:
    name: security
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - name: Run static and dependency security checks
        run: python scripts/ci/security_checks.py

  required:
    name: ci-required
    if: always()
    needs: [changes, backend, frontend, workflow-lint, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          WORKFLOWS: ${{ needs.workflow-lint.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          test "$CHANGES" = success
          for result in "$BACKEND" "$FRONTEND" "$WORKFLOWS" "$SECURITY"; do
            test "$result" = success -o "$result" = skipped || exit 1
          done
